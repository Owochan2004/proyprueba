<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sistema de Acceso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-container">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingrese sus credenciales para continuar</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="ejemplo@dominio.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
      </div>
      <button type="submit" id="btnSubmit">Ingresar al Sistema</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
